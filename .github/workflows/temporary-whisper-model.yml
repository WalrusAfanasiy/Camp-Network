name: Temporary Whisper Model Ferry

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ferry:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download Whisper small Q5 model
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 5 --retry-delay 3 \
            -o ggml-small-q5_1.bin \
            https://github.com/w3xgroup/taskurio-models/releases/download/whisper-models-v1/ggml-small-q5_1.bin
          echo "ae85e4a935d7a567bd102fe55afc16bb595bdb618e11b2fc7591bc08120411bb  ggml-small-q5_1.bin" | sha256sum -c -
          test "$(stat -c%s ggml-small-q5_1.bin)" = "190085487"
          ls -lh ggml-small-q5_1.bin

      - name: Upload model artifact
        uses: actions/upload-artifact@v4
        with:
          name: whisper-small-q5_1
          path: ggml-small-q5_1.bin
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
