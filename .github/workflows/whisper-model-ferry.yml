name: Temporary Whisper Model Ferry

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/whisper-ferry-trigger.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ferry:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download Whisper small.en q5_1 model
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 5 --retry-delay 3 \
            -o ggml-small.en-q5_1.bin \
            "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-small.en-q5_1.bin"
          test "$(stat -c%s ggml-small.en-q5_1.bin)" -gt 150000000
          sha256sum ggml-small.en-q5_1.bin

      - name: Upload model artifact
        uses: actions/upload-artifact@v4
        with:
          name: whisper-small-en-q5_1
          path: ggml-small.en-q5_1.bin
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
